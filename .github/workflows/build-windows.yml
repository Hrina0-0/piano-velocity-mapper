name: Build Windows package

# 打 tag（v1.3.0）就自动构建分发包并挂到 Release 上；
# 也可以在 Actions 页面手动触发。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.3.0）'
        required: true
        default: '0.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 自检
        run: python -c "import tkinter, mido, pygame.midi, velocity_mapper, gui, engine"

      - name: 打包 exe
        run: python build_exe.py

      - name: 组装压缩包
        shell: pwsh
        run: |
          $ref = '${{ github.ref_name }}'
          $v = $ref.TrimStart('v')
          if (-not $v -or $v -eq $ref) { $v = '${{ inputs.version }}' }
          if (-not $v) { $v = '0.0.0' }
          ./make_release.ps1 -SkipBuild -Version $v

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: PianoVelocityMapper
          path: release/PianoVelocityMapper-v*.zip
          if-no-files-found: error

      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/PianoVelocityMapper-v*.zip
          body: |
            解压双击 `PianoVelocityMapper.exe` 就能用，**不需要装 Python**。

            首次运行会解压依赖，慢一两秒属正常。

            需要一个虚拟 MIDI 端口（loopMIDI 等）：
            https://www.tobias-erichsen.de/software/loopmidi.html

            源码在这个仓库里（MIT 许可）：右上角 Code → Download ZIP。
