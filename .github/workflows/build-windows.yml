name: Build Windows exe

# 打 tag（v1.0.0）就自动构建绿色版 exe 并挂到 Release 上；
# 也可以在 Actions 页面手动触发。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 自检
        run: python -c "import tkinter, mido, pygame.midi, velocity_mapper, gui, engine"

      - name: 打包
        run: python build_exe.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: PianoVelocityMapper
          path: dist/PianoVelocityMapper.exe
          if-no-files-found: error

      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PianoVelocityMapper.exe
          body: |
            绿色版单文件 exe，双击即用（不需要装 Python）。

            首次运行会解压依赖，慢一两秒属正常。

            需要虚拟 MIDI 端口（loopMIDI 等）：https://www.tobias-erichsen.de/software/loopmidi.html
