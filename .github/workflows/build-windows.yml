name: Build Windows package

# 打 tag（v1.3.3）就自动构建分发包并挂到 Release 上；
# 也可以在 Actions 页面手动触发。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.3.3）'
        required: true
        default: '0.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          # 固定 3.12：python-rtmidi（能看见运行期间才出现的 MIDI 端口的后端）
          # 只提供到 cp312 的 Windows 预编译 wheel，3.13 只能源码编译，
          # 构建慢而且容易失败。
          python-version: '3.12'

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 自检
        run: python -c "import tkinter, mido, pygame.midi, rtmidi, mido.backends.rtmidi, velocity_mapper, gui, engine"

      - name: 打包 exe
        run: python build_exe.py

      - name: 组装压缩包
        shell: pwsh
        run: |
          $ref = '${{ github.ref_name }}'
          $v = $ref.TrimStart('v')
          if (-not $v -or $v -eq $ref) { $v = '${{ inputs.version }}' }
          if (-not $v) { $v = '0.0.0' }
          ./make_release.ps1 -SkipBuild -Version $v

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: PianoVelocityMapper
          path: release/PianoVelocityMapper-v*.zip
          if-no-files-found: error

      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/PianoVelocityMapper-v*.zip
          # 发布说明统一放在 docs/release-notes.md，改版本时改这一个文件即可。
          # 注意：不要把说明内嵌在 workflow 里 —— 每次推 tag 都会用这里的文本
          # 覆盖 Release 页面，手写的详细说明会被冲掉。
          body_path: docs/release-notes.md
